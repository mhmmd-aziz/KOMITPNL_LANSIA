<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Kenali SIGAP, proyek deteksi jatuh pada lansia melalui kamera yang menghubungkan peringatan kejadian dengan keluarga agar bantuan dapat segera dikoordinasikan." />
    <link rel="icon" type="image/svg+xml" href="/assets/symbol.svg" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>SIGAP — Lebih cepat tahu, lebih sigap membantu</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <!-- Loader awal sebelum JavaScript dimuat; tampilannya sama dengan SigapLoader fullScreen -->
      <style>
        .boot-loader { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #fff; }
        .boot-loader img { width: 128px; height: auto; }
        .boot-loader span { position: relative; width: 128px; height: 2px; overflow: hidden; border-radius: 999px; background: #ededed; }
        .boot-loader span::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: #0a0a0a; animation: boot-progress 1.1s ease-in-out infinite; }
        @keyframes boot-progress { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      </style>
      <div class="boot-loader" role="status" aria-label="Memuat SIGAP">
        <img src="/assets/wordmark.svg" alt="SIGAP" />
        <span aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
