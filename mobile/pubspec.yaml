name: sigap_mobile
description: "SIGAP - Aplikasi Keluarga Pemantauan Deteksi Jatuh Lansia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  record: ^6.0.0
  path_provider: ^2.1.5
  web_socket_channel: ^3.0.1
  intl: ^0.20.1
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
